server:
  port: 8080

spring:
  application:
    name: employee-redis-app
  datasource:
    url: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  cache:
    type: redis

app:
  seed:
    enabled: true
  cache:
    default-ttl: 60s
    employee-ttl: 30s
    employee-list-ttl: 20s
    department-ttl: 20s
